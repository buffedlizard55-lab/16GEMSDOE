name: egress-probe
# Temporary probe: which official public-data hosts are reachable from GitHub-hosted runners?
# Results are committed back to the same branch so they can be read without log access.
# It deliberately does NOT contact drivendata.org (DrivenData Terms of Use prohibit automated access).
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/egress-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p evidence/ci
          out=evidence/ci/egress_probe.txt
          {
            echo "run_at_utc: $(date -u +%FT%TZ)"
            echo "runner: $(nproc) vCPU; $(free -m | awk 'NR==2{print $2" MB RAM"}'); $(df -h / | awk 'NR==2{print $4" free"}'); $(python3 --version)"
            echo "--- HEAD requests (follow redirects) ---"
            for u in \
              https://gdr.openei.org/submissions/1391 \
              https://gdr.openei.org/files/1391/qfaults_ingenious_nad83conus117_2023-06-27.zip \
              https://gdr.openei.org/files/1391/wellspringdata.gdb.zip \
              https://gdr.openei.org/files/1391/paleo_geothermal_regional.zip \
              https://gdr.openei.org/files/1391/great_basin_q_volcanics.zip \
              https://www.sciencebase.gov/catalog/item/657e1d85d34e23d3533209f7 \
              https://data.usgs.gov/datacatalog/data/USGS:657e1d85d34e23d3533209f7 \
              https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/n39w119/USGS_13_n39w119.tif \
              https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer?f=pjson \
              https://mrdata.usgs.gov/geology/state/ \
              https://www2.census.gov/geo/tiger/TIGER2023/PRISMROADS/ \
              https://doi.org/10.5066/P93LGLVQ \
              https://earthquake.usgs.gov/fdsnws/event/1/count?format=geojson\&minmagnitude=2 \
              https://pypi.org/simple/numpy/ ; do
              code=$(curl -s -o /dev/null -I -L -m 40 -w "%{http_code} len=%{size_download} type=%{content_type}" "$u" || echo "curl-failed")
              echo "$code  $u"
            done
          } > "$out" 2>&1
          cat "$out"
      - name: Commit results back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ci/egress_probe.txt
          git commit -m "ci: egress probe results [skip ci]" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
