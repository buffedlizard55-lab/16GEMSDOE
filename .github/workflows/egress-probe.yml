name: egress-probe
# Temporary probe: confirms (a) workflow files can be pushed with this token and
# (b) which official public-data hosts are reachable from GitHub-hosted runners.
# It deliberately does NOT contact drivendata.org (DrivenData Terms of Use prohibit automated access).
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/egress-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner
        run: |
          nproc; free -m | head -2; df -h / | tail -1; python3 --version
      - name: Reachability of official public-data hosts (HEAD)
        run: |
          for u in \
            https://gdr.openei.org/submissions/1391 \
            https://gdr.openei.org/files/1391/qfaults_ingenious_nad83conus117_2023-06-27.zip \
            https://www.sciencebase.gov/catalog/item/657e1d85d34e23d3533209f7 \
            https://data.usgs.gov/datacatalog/data/USGS:657e1d85d34e23d3533209f7 \
            https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/n39w119/USGS_13_n39w119.tif \
            https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer?f=pjson \
            https://mrdata.usgs.gov/geology/state/ \
            https://www2.census.gov/geo/tiger/TIGER2023/PRISMROADS/ \
            https://doi.org/10.5066/P93LGLVQ ; do
            code=$(curl -s -o /dev/null -I -L -m 40 -w "%{http_code} len=%{size_download} type=%{content_type}" "$u" || echo "curl-failed")
            echo "$code  $u"
          done
