name: external-verification
# Verifies data provenance and external-data hypotheses against OFFICIAL open-data hosts (GDR, USGS).
# Runs on GitHub-hosted runners because the agent sandbox cannot reach these hosts.
# Results are committed back to the triggering branch (evidence/ci/).  No DrivenData host is contacted
# (DrivenData Terms of Use prohibit automated access: https://www.drivendata.org/termsofuse/).
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/ci_external_verify.py'
      - '.github/workflows/external-verification.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial stack
        run: pip install numpy scipy rasterio geopandas pyogrio shapely pyproj pandas
      - name: Run verification
        run: python scripts/ci_external_verify.py
      - name: Commit results back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ci/
          git commit -m "ci: external verification results [skip ci]" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
