name: source-health
# Weekly link check of the OFFICIAL data/literature sources listed in registry/sources.json (USGS, DOE/OSTI, GDR, NLR, GitHub).
# DrivenData hosts are deliberately skipped: DrivenData's Terms of Use forbid robots/spiders (https://www.drivendata.org/termsofuse/).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-refresh
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/source_health.py
      - run: python scripts/build_site.py
      - name: Commit refreshed status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore: weekly source-health refresh [skip ci]" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
